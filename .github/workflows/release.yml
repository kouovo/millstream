name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the "Version Packages" branch, create tags/releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Tests already ran in CI on the PR and on main; only cheap static checks here.
      # (`pnpm release` builds before publishing.)
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Pending changesets → opens/updates a "Version Packages" PR.
      # No pending changesets (i.e. that PR was merged) → builds and publishes
      # every package whose version isn't on npm yet, then tags + GitHub releases.
      # v2 is the action line for @changesets/cli v3 (v1 parses `New tag:` stdout lines
      # that the v3 CLI no longer prints, so it never pushed tags or created releases).
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
